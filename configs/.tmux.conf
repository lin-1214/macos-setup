# ─────────────────────────────────────────────────────────────────────────────
# Core settings
# ─────────────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true-color

set -g history-limit 50000
set -sg escape-time 0          # no escape delay (critical for vim/nvim)
set -g focus-events on         # let vim detect focus changes
set -g mouse on                # mouse scrolling, pane click, resize
set -g status-interval 5
set -g display-time 3000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on     # keep window numbers compact after closing one

# ─────────────────────────────────────────────────────────────────────────────
# Prefix: Ctrl+a  (easier to reach than Ctrl+b)
# ─────────────────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix   # Ctrl+a Ctrl+a sends literal Ctrl+a to the shell

# ─────────────────────────────────────────────────────────────────────────────
# Key bindings
# ─────────────────────────────────────────────────────────────────────────────
# Reload config in place
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Split in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window         -c "#{pane_current_path}"

# Navigate panes — prefix + hjkl (vim-style, works on all terminals/macOS)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate windows — prefix + [ and ] (easy to reach)
bind [ previous-window
bind ] next-window

# Resize panes — prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom current pane — prefix + z (built-in, remapped for clarity)
bind z resize-pane -Z

# ─────────────────────────────────────────────────────────────────────────────
# Copy mode (vi-style)
# ─────────────────────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ─────────────────────────────────────────────────────────────────────────────
# Plugins — managed by TPM
# Install: prefix + I   Update: prefix + U   Remove: prefix + Alt+u
# ─────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # sane defaults everyone agrees on
set -g @plugin 'tmux-plugins/tmux-yank'       # y to yank selection to clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'  # persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save every 15 min
set -g @plugin 'catppuccin/tmux'              # Catppuccin Mocha theme

# ─── Catppuccin ───────────────────────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_modules_right "application session date_time"
set -g @catppuccin_date_time_text "%H:%M"

# ─── Resurrect ────────────────────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'

# ─── Continuum ────────────────────────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ─────────────────────────────────────────────────────────────────────────────
# Initialize TPM  (must be the very last line)
# ─────────────────────────────────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
