# Starship prompt — Catppuccin Mocha palette
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

# Prompt layout (all on one line, newline before the character)
format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ─── Catppuccin Mocha palette ─────────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

# ─── Modules ──────────────────────────────────────────────────────────────────
[directory]
style             = "bold blue"
format            = "[$path]($style) "
truncation_length = 4
truncate_to_repo  = true

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Desktop"   = ""

[git_branch]
symbol = " "
style  = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style  = "bold red"
format = "([$all_status$ahead_behind]($style) )"
ahead  = "⇡${count}"
behind = "⇣${count}"
staged = "[+${count}](green)"

[python]
symbol       = " "
style        = "bold yellow"
format       = "[$symbol$version]($style) "
detect_files = ["*.py", "pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[nodejs]
symbol = " "
style  = "bold green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style  = "bold peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style  = "bold sky"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style  = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2_000   # only show for commands taking ≥ 2 s
style    = "bold yellow"
format   = "[took $duration]($style) "

[character]
success_symbol  = "[❯](bold green)"
error_symbol    = "[❯](bold red)"
vimcmd_symbol   = "[❮](bold yellow)"

[time]
disabled = true
